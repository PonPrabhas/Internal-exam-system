services:
  - type: web
    name: internal-exam-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn onlinexam.wsgi
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: onlinexam.settings
      - key: PYTHON_VERSION
        value: 3.10
