<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .contact-container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-animate:hover {
      transform: scale(1.05);
      transition: all 0.3s ease-in-out;
    }
    label {
      font-weight: 700;
    }
    .footer {
      position: relative;
      bottom: 0;
      width: 100%;
      text-align: center;

      background-color: #343a40;
      color: white;

    }
  </style>
</head>

<body>
  {% include "exam/navbar.html" %}
  <br><br>

  <div class="container">
    <div class="contact-container">
      <h3 class="alert alert-success text-center">Please fill out the form to contact us</h3>
      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_name">Name:</label>
          <input type="text" name="name" id="id_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="id_email">Email:</label>
          <input type="email" name="email" id="id_email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="id_message">Message:</label>
          <textarea name="message" id="id_message" class="form-control" rows="4" required></textarea>
        </div>
        <div class="text-center">
          <input type="submit" value="Submit" class="btn btn-primary btn-animate">
        </div>
      </form>
    </div>
  </div>

  <br><br>
  <div class="footer">
    {% include "exam/footer.html" %}
  </div>
</body>

</html>
