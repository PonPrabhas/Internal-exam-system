{% extends 'exam/adminbase.html' %}
{% block content %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

  <style type="text/css">
    .bg-c-blue {
      background: linear-gradient(135deg, #3c74c9, #00bcd4);
      border-radius: 10px;
      padding: 20px;
      transition: transform 0.3s ease-in-out, opacity 0.6s ease-in-out;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      -webkit-box-shadow: 0 4px 6px 6px rgba(0, 0, 0, 0.16);
      box-shadow: 1 4px 6px rgba(0, 0, 0, 0.90);
      margin-bottom: 30px;
      transition: all 0.3s ease-in-out;
    }

    .card .card-block {
      padding: 25px;
    }

    .text-center {
      text-align: center;
    }
    .form{
    text-color: white;
    }
  </style>
</head>

<br><br>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card bg-c-blue">
        <div class="card-block">
          <h3 class="text-center text-white">Upload Syllabus</h3>
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
              <label for="course" class="text-white">Select Course:</label>
              <select name="course_id" id="course" class="form-control">
                {% for course in courses %}
                  <option value="{{ course.id }}">{{ course.course_name }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-success">Upload</button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>


{% endblock %}
