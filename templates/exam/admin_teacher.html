{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
  <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
  <style type="text/css">
    a:link {
      text-decoration: none;
    }

    .order-card {
      color: rgb(255, 255, 255);
    }

    .bg-c-blue,
    .bg-c-green,
    .bg-c-yellow,
    .bg-c-pink {
      background: linear-gradient(135deg, #3c74c9, #00bcd4);
      border-radius: 10px;
      padding: 20px;
      transition: transform 0.3s ease-in-out, opacity 0.6s ease-in-out;
      opacity: 0;
      /* Initially hidden */
      transform: translateY(20px);
      /* Moves card slightly down */
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered animation delay for each card */
    .bg-c-blue {
      animation-delay: 0.2s;
    }

    .bg-c-green {
      animation-delay: 0.4s;
    }

    .bg-c-yellow {
      animation-delay: 0.6s;
    }

    .bg-c-pink {
      animation-delay: 0.8s;
    }

    /* Hover effect for smooth interaction */
    .bg-c-blue:hover,
    .bg-c-green:hover,
    .bg-c-yellow:hover,
    .bg-c-pink:hover {
      transform: scale(1.05);
      /* Slightly enlarges card on hover */
    }

    .card {

      -webkit-box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
      box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
      margin-bottom: 30px;
      -webkit-transition: all 0.3s ease-in-out;
      transition: all 0.3s ease-in-out;
    }

    .card .card-block {
      padding: 25px;
    }

    .order-card i {
      font-size: 26px;
    }

    .f-left {
      float: left;
    }

    .f-right {
      float: right;
    }

    header {
      left: 0px;
      right: 0px;
    }
  </style>
</head>
<br><br>

<div class="container">
  <div class="row">
    <div class="col-md-4 col-xl-4">
      <a href="admin-view-teacher" style="text-decoration: none;color:white;">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <h6 class="m-b-20"> Total Approved Teacher </h6>
            <h2 class="text-right"><i class="fas fa-chalkboard-teacher f-left"></i><span>{{total_teacher}}</span></h2>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-4 col-xl-4">
      <a href="admin-view-pending-teacher" style="text-decoration: none;color:white;">
        <div class="card bg-c-yellow order-card">
          <div class="card-block">
            <h6 class="m-b-20">Total Pending Teacher </h6>
            <h2 class="text-right"><i class="fas fa-sync-alt f-left"></i><span>{{pending_teacher}}</span></h2>
          </div>
        </div>
      </a>
    </div>
    </a>
  </div>
</div>
</div>


<br><br><br><br><br><br><br><br><br><br>

<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>


{% endblock content %}
