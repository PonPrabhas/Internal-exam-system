{% extends 'exam/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
  <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    a:link {
      text-decoration: none;
    }

    .order-card {
      color: white;
    }

    .bg-c-blue,
    .bg-c-green,
    .bg-c-yellow,
    .bg-c-pink {
      background: linear-gradient(135deg, #3c74c9, #00bcd4);
      border-radius: 10px;
      padding: 20px;
      transition: transform 0.3s ease-in-out, opacity 0.6s ease-in-out;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bg-c-blue { animation-delay: 0.2s; }
    .bg-c-green { animation-delay: 0.4s; }
    .bg-c-yellow { animation-delay: 0.6s; }
    .bg-c-pink { animation-delay: 0.8s; }

    .bg-c-blue:hover,
    .bg-c-green:hover,
    .bg-c-yellow:hover,
    .bg-c-pink:hover {
      transform: scale(1.05);
    }

    .card {
      box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
      margin-bottom: 30px;
      transition: all 0.3s ease-in-out;
    }

    .card .card-block {
      padding: 25px;
    }

    .order-card i {
      font-size: 26px;
    }

    .f-left { float: left; }
    .f-right { float: right; }
  </style>
</head>

<br><br>

<div class="container">
  <div class="row">
    <div class="col-md-4 col-xl-6">
      <a href="admin-view-student" style="text-decoration: none;color:white;">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <h6 class="m-b-20"> Total Registered Students </h6>
            <h2 class="text-right"><i class="fas fa-user-graduate f-left"></i><span>{{total_student}}</span></h2>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-4 col-xl-6">
      <a href="admin-view-student-marks" style="text-decoration: none;color:white;">
        <div class="card bg-c-yellow order-card">
          <div class="card-block">
            <h6 class="m-b-20">Student Marks </h6>
            <h2 class="text-right"><i class="fas fa-sort-numeric-up f-left"></i><span><i class="fas fa-eye"></i></span></h2>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>

<br><br><br><br><br><br><br><br><br><br>

<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>

{% endblock content %}
